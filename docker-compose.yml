
services:
  invoice-db:
    image: mysql:8.0
    container_name: invoice-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invoice_service
      MYSQL_USER: invoice_user
      MYSQL_PASSWORD: invoice_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - '3310:3306'
    volumes:
      - invoice_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --collation-server=utf8mb4_unicode_ci

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: invoice-rabbitmq
    restart: unless-stopped
    ports:
      - '5673:5672'
      - '15675:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: quay.io/minio/minio:latest
    container_name: invoice-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9010:9000'
      - '9011:9001'
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data

  invoice-service:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: invoice-service
    depends_on:
      invoice-db:
        condition: service_started
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTO_MIGRATE: 'true'
      DATABASE_HOST: invoice-db
      DATABASE_PORT: '3306'
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      ORDER_SERVICE_API_KEY: ${ORDER_SERVICE_API_KEY}
    ports:
      - '5005:5005'
    networks:
      - default
      - itv-network

volumes:
  invoice_mysql_data:
  minio_data:
  rabbitmq_data:

networks:
  itv-network:
    external: true
    name: itv-network

