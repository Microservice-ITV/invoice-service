name: 🚀 Invoice Service Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: invoice-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/invoice-service

jobs:

  # ==========================================================
  # BUILD & TEST
  # ==========================================================

  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 🧬 Generate Prisma Client
        run: npm run prisma:generate

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Run tests
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/test
          SERVICE_API_KEY: test-service-key
          ORDER_SERVICE_URL: http://127.0.0.1:8001
          ORDER_SERVICE_API_KEY: test-order-key
          MINIO_ACCESS_KEY: test-access-key
          MINIO_SECRET_KEY: test-secret-key
          JWT_SECRET: test-jwt-secret
        run: npm test

      - name: 🐳 Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # STAGING
  # ==========================================================

  staging:
    name: 🧪 Staging Validation
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📤 Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: "docker-compose.prod.yml,scripts/deploy.sh"
          target: "/var/www/html/microservices/invoice-service/"

      - name: 🧪 Deploy & Validate Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          command_timeout: 10m

          script: |
            set -euo pipefail

            cd /var/www/html/microservices/invoice-service

            chmod +x scripts/deploy.sh

            cat > .env.staging <<'EOF'
            ${{ secrets.STAGING_ENV }}
            EOF

            chmod 600 .env.staging

            ./scripts/deploy.sh staging \
              "${{ env.IMAGE_NAME }}:${{ github.sha }}"


  # ==========================================================
  # PRODUCTION
  # ==========================================================

  production:
    name: 🚀 Production Deployment
    runs-on: ubuntu-latest
    needs: staging

    environment:
      name: production

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📤 Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: "docker-compose.prod.yml,scripts/deploy.sh"
          target: "/var/www/html/microservices/invoice-service/"

      - name: 🚀 Deploy Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          command_timeout: 15m

          script: |
            set -euo pipefail

            cd /var/www/html/microservices/invoice-service

            chmod +x scripts/deploy.sh

            cat > .env.prod <<'EOF'
            ${{ secrets.PROD_ENV }}
            EOF

            chmod 600 .env.prod

            export PRODUCTION_SMOKE_TEST_URL="https://api.dailyneeditems.com/invoices/api/v1/health"

            ./scripts/deploy.sh production \
              "${{ env.IMAGE_NAME }}:${{ github.sha }}"
